<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@hwidbest | Portfolio</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0b0e;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #121216;
            padding: 44px 36px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background-color: #1c1c22;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -1px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #71717a;
            font-weight: 400;
            margin-bottom: 28px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .tag {
            background-color: #1a1a20;
            color: #a1a1aa;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 12px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a20;
            color: #f4f4f5;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn:hover {
            background-color: #24242c;
            transform: translateY(-2px);
        }

        .btn.primary {
            background-color: #f4f4f5;
            color: #0b0b0e;
            font-weight: 600;
        }

        .btn.primary:hover {
            background-color: #d4d4d8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">HB</div>
        <h1>@hwidbest</h1>
        <p class="subtitle">Developer & Digital Creator</p>

        <div class="tags">
            <span class="tag">Rust</span>
            <span class="tag">Lua</span>
            <span class="tag">Arch Linux</span>
            <span class="tag">Web</span>
        </div>

        <div class="links">
            <a href="https://t.me" target="_blank" class="btn primary">
                Telegram — @hwidbest
            </a>
            <a href="https://github.com" target="_blank" class="btn">
                GitHub
            </a>
        </div>
    </div>

</body>
</html>
